name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Test the pieces
        run: ruby .rubites/test/rubites_test.rb

      - name: Test the game in a real terminal
        run: ruby .rubites/test/tui_test.rb

      # The exercises ship broken, so this is expected to fail. It runs anyway
      # to catch an exercise that crashes for the wrong reason.
      - name: Smoke-test every exercise
        run: .rubites/bin/rubites --check || true
